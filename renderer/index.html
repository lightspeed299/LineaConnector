<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Linea Connector</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ========== セットアップウィザード ========== -->
  <div id="wizard" class="hidden">
    <div class="wizard-header">
      <h1>Linea Connector</h1>
      <p class="wizard-sub">初回セットアップ</p>
    </div>

    <!-- Step 1: API Key -->
    <div id="wizard-step1" class="wizard-step">
      <div class="step-badge">ステップ 1 / 3</div>
      <h2>APIキーを入力</h2>
      <p class="step-desc">Lineaの「Connectorセットアップ」ページでAPIキーを発行し、下に貼り付けてください。</p>
      <input type="text" id="wizard-apikey" placeholder="sk_live_..." autocomplete="off" spellcheck="false">
      <button id="wizard-next1" class="btn-primary" disabled>次へ</button>
    </div>

    <!-- Step 2: Engine -->
    <div id="wizard-step2" class="wizard-step hidden">
      <div class="step-badge">ステップ 2 / 3</div>
      <h2>エンジンを選択</h2>
      <p class="step-desc">USI対応の将棋エンジン（.exe）を選択してください。</p>
      <div class="engine-select-row">
        <input type="text" id="wizard-engine" readonly placeholder="エンジンを選択...">
        <button id="wizard-browse" class="btn-secondary">参照...</button>
      </div>
      <p id="wizard-eval-status" class="eval-status"></p>
      <div class="wizard-nav">
        <button id="wizard-back2" class="btn-secondary btn-sm">戻る</button>
        <button id="wizard-next2" class="btn-primary btn-sm" disabled>次へ</button>
      </div>
    </div>

    <!-- Step 3: Options -->
    <div id="wizard-step3" class="wizard-step hidden">
      <div class="step-badge">ステップ 3 / 3</div>
      <h2>基本設定</h2>
      <p class="step-desc">あとから設定画面で変更できます。</p>
      <div class="options-grid">
        <label>Threads<input type="number" id="wizard-threads" value="4" min="1" max="128"></label>
        <label>Hash (MB)<input type="number" id="wizard-hash" value="1024" min="16" max="65536"></label>
        <label>MultiPV<input type="number" id="wizard-multipv" value="3" min="1" max="10"></label>
        <label>FV_SCALE<input type="number" id="wizard-fvscale" value="24" min="1" max="128"></label>
      </div>
      <label class="check-option">
        <input type="checkbox" id="wizard-engine-ondemand">
        <span>省メモリモード（解析時のみエンジンを起動）</span>
      </label>
      <div class="wizard-nav">
        <button id="wizard-back3" class="btn-secondary btn-sm">戻る</button>
        <button id="wizard-finish" class="btn-primary btn-sm">セットアップ完了</button>
      </div>
    </div>
  </div>

  <!-- ========== メイン画面 ========== -->
  <div id="main" class="hidden">
    <!-- ツールバー -->
    <header>
      <div class="header-left">
        <h1>Linea Connector</h1>
        <span id="version" class="version"></span>
      </div>
      <div id="status-badge" class="status-badge offline">
        <span class="status-dot"></span>
        <span id="status-text">OFFLINE</span>
      </div>
    </header>

    <!-- アップデート通知 -->
    <div id="update-bar" class="update-bar hidden">
      <span id="update-msg"></span>
      <button id="btn-update" class="btn-update">ダウンロード</button>
    </div>

    <!-- コンテンツ -->
    <div class="content-area">
      <!-- 接続情報 -->
      <section class="info-panel">
        <div class="info-row">
          <span class="info-label">エンジン</span>
          <span id="engine-name" class="info-value">—</span>
        </div>
        <div class="info-row">
          <span class="info-label">エンジン状態</span>
          <span id="engine-status" class="info-value">—</span>
        </div>
      </section>

      <!-- 設定 -->
      <section class="settings-panel">
        <h2>設定</h2>
        <div class="form-group">
          <label for="cfg-apikey">APIキー</label>
          <div class="input-row">
            <input type="password" id="cfg-apikey" readonly>
            <button id="btn-toggle-key" class="btn-icon" title="表示/非表示">表示</button>
          </div>
        </div>
        <div class="form-group">
          <label for="cfg-engine-select">エンジン（複数登録できます・選択して保存で切替）</label>
          <div class="input-row">
            <select id="cfg-engine-select" title="使用するエンジンを選択"></select>
            <button id="btn-engine-add" class="btn-secondary btn-sm" title="別のエンジンを追加登録">追加</button>
            <button id="btn-engine-dup" class="btn-icon btn-sm" title="選択中のエンジンを複製（評価関数違いの登録に便利）">複製</button>
            <button id="btn-engine-del" class="btn-icon btn-sm" title="選択中のエンジンを登録から削除">削除</button>
          </div>
        </div>
        <div class="engine-entry-box">
          <div class="form-group">
            <label for="cfg-engine-name">表示名</label>
            <input type="text" id="cfg-engine-name" placeholder="例: 水匠5" spellcheck="false" autocomplete="off">
          </div>
          <div class="form-group">
            <label for="cfg-engine">実行ファイル</label>
            <div class="input-row">
              <input type="text" id="cfg-engine" readonly>
              <button id="btn-select-engine" class="btn-secondary btn-sm">参照...</button>
            </div>
          </div>
          <div class="form-group">
            <label for="cfg-eval">評価関数（エンジン選択時に自動検出・変更可）</label>
            <div class="input-row">
              <input type="text" id="cfg-eval" readonly placeholder="エンジンを選択すると自動入力されます">
              <button id="btn-select-eval" class="btn-secondary btn-sm">参照...</button>
            </div>
          </div>
          <div class="options-grid compact">
            <label>Threads<input type="number" id="cfg-threads" min="1" max="128"></label>
            <label>Hash (MB)<input type="number" id="cfg-hash" min="16" max="65536"></label>
            <label>MultiPV<input type="number" id="cfg-multipv" min="1" max="10"></label>
            <label>FV_SCALE<input type="number" id="cfg-fvscale" min="1" max="128"></label>
          </div>
        </div>
        <div class="form-group">
          <label for="cfg-book-select">定跡ファイル（.db / .ybb・複数登録できます）</label>
          <div class="input-row">
            <select id="cfg-book-select" title="使用する定跡を選択"></select>
            <button id="btn-book-add" class="btn-secondary btn-sm" title="定跡ファイルを追加登録">追加</button>
            <button id="btn-book-del" class="btn-icon btn-sm" title="選択中の定跡を登録から削除">削除</button>
          </div>
          <!-- 定跡はファイル名が user_book1.db 等で衝突しやすいため、選択中のフルパスを常時表示 -->
          <input type="text" id="cfg-book-path" class="stacked-path" readonly placeholder="未設定" title="選択中の定跡のフルパス">
        </div>
        <label class="check-option compact">
          <input type="checkbox" id="cfg-engine-ondemand">
          <span>省メモリモード（解析時のみエンジンを起動）</span>
        </label>
        <div class="settings-actions">
          <button id="btn-save" class="btn-primary btn-sm">設定を保存</button>
          <button id="btn-reconnect" class="btn-secondary btn-sm">再接続</button>
        </div>
      </section>

      <!-- ログ -->
      <section class="log-panel">
        <div class="log-header">
          <h2>ログ</h2>
          <button id="btn-copy-usi" class="btn-icon btn-sm" title="エンジンとのUSI通信ログ(直近100件)をコピー">⚙ USI通信</button>
          <button id="btn-copy-log" class="btn-icon btn-sm" title="ログをコピー">📋 コピー</button>
        </div>
        <div id="log-container"></div>
      </section>
    </div>

    <!-- ステータスバー -->
    <div class="status-bar">
      <span class="status-bar-item" id="sb-connection">接続: —</span>
      <span class="status-bar-item" id="sb-engine">エンジン: —</span>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
